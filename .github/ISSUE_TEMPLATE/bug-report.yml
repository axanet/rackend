name: Bug report
description: Something in rackend does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rackend version`, or the image tag.
      placeholder: "0.1.2 (ghcr.io/axanet/rackend:0.1)"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: How you run it
      description: Docker, binary, operating system, reverse proxy, storage backend.
      placeholder: "Docker on Debian 13 behind Caddy, S3 storage on RustFS"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what happened instead. Include the `code` and `request_id` of error responses.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (remove secrets and personal data).
      render: text
