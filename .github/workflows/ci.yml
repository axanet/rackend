name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # tags, for the migration immutability check
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh lint

  commits:
    # Conventional Commits (cog.toml): releases take their version from them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v3
        with: { install_args: cocogitto }
      - run: scripts/ci.sh commits "$RANGE"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}

  test:
    runs-on: ubuntu-24.04
    env:
      # The error contract checks every problem code against the docs.
      RACKEND_DOCS_DIR: ${{ github.workspace }}/rackend-homepage/src/content/docs/docs/next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: axanet/rackend-homepage, path: rackend-homepage }
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh test
      - run: scripts/ci.sh upgrade

  docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: rackend:ci
          build-args: RACKEND_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: image size (compressed budget 40 MB, SPEC §2)
        run: docker save rackend:ci | gzip | wc -c | awk '{ printf "%.1f MB\n", $1/1048576; if ($1 > 40*1048576) exit 1 }'
      - run: scripts/ci.sh docker-smoke rackend:ci
      - uses: actions/checkout@v5
        if: matrix.platform == 'linux/amd64'
        with: { repository: axanet/rackend-homepage, path: rackend-homepage }
      - name: getting started guide, verbatim (SPEC §20 M7)
        if: matrix.platform == 'linux/amd64'
        env:
          RACKEND_DOCS_DIR: ${{ github.workspace }}/rackend-homepage/src/content/docs/docs/next
        run: |
          docker tag rackend:ci "$(grep -oE 'ghcr\.io/axanet/rackend:[0-9.]+' "$RACKEND_DOCS_DIR/getting-started.mdx" | head -1)"
          scripts/getting-started.sh

  clients:
    # OpenAPI documents validate; generated TypeScript and Python clients
    # compile and pass a smoke test against a running server (SPEC §20 M7).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh clients

  collab:
    # Collaborative editing with y-websocket clients across a server kill
    # and restart; read-only edits are never stored (SPEC §20 M9).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh collab
