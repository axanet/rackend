name: conformance

# OpenID Foundation conformance suite, Basic OP and Config OP profiles
# (SPEC §11.8.7): nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  oidc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rackend:conformance
          cache-from: type=gha,scope=linux/amd64
      - run: scripts/conformance/run.sh
