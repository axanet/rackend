[package]
name = "rackend-http"
description = "HTTP adapter of rackend (axum): REST, errors, admin UI shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rackend-core = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1", "http2", "json", "query", "form", "matched-path", "multipart", "ws"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic"] }
governor = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "fs", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
time = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
uuid = { workspace = true }
