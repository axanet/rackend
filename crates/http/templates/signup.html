{% extends "base.html" %}
{% block content %}
<h1>{{ t.get("signup.title") }}</h1>
{% if let Some(e) = error %}<p class="err" role="alert">{{ e }}</p>{% endif %}
<form method="post" action="/auth/signup">
  <input type="hidden" name="ar" value="{{ ar }}">
  <label>{{ t.get("login.email") }}<input type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus></label>
  <label>{{ t.get("login.password") }}<input type="password" name="password" autocomplete="new-password" required maxlength="256"></label>
  <label>{{ t.get("signup.repeat") }}<input type="password" name="password_confirm" autocomplete="new-password" required maxlength="256"></label>
  <button type="submit">{{ t.get("signup.submit") }}</button>
</form>
<p class="links"><a href="/auth/login?ar={{ ar|urlencode }}">{{ t.get("signup.have_account") }}</a></p>
{% endblock %}
