[package]
name = "rackend-store-sqlite"
description = "Store port on SQLite: connections, migrations, rule-to-SQL compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rackend-core = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
fs4 = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[[test]]
name = "upgrade_paths"
path = "../../tests/upgrade/upgrade_paths.rs"

[[example]]
name = "generate_fixture"
path = "../../tests/upgrade/generate.rs"
