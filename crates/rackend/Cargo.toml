[package]
name = "rackend"
description = "rackend: self-hosted single-binary backend-as-a-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
rackend-core = { workspace = true }
rackend-store-sqlite = { workspace = true }
rackend-blob-fs = { workspace = true }
rackend-blob-s3 = { workspace = true }
rackend-imaging = { workspace = true }
rackend-mail-smtp = { workspace = true }
rackend-idp-client = { workspace = true }
rackend-host-metrics = { workspace = true }
rackend-http = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi", "env-filter", "registry"] }
serde_json = { workspace = true }
time = { workspace = true }
mimalloc = { workspace = true }
rust-embed = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
default = ["otlp"]
# OTLP export of traces and metrics when RACKEND_OTLP_ENDPOINT is set (SPEC §14.4).
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
# Broker contract test against Keycloak (requires Docker), SPEC §20 M6.
keycloak-tests = []

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[build-dependencies]
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
kamadak-exif = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"

[[test]]
name = "dependency_rules"
path = "../../tests/architecture/dependency_rules.rs"

[[test]]
name = "api"
path = "../../tests/api/main.rs"
